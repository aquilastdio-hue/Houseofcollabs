<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="House of Collabs — hire creators brands love">
  <defs>
    <clipPath id="ov"><circle cx="96" cy="72" r="34"/></clipPath>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1306c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e1306c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f8f7fa"/>
  <circle cx="1040" cy="120" r="300" fill="url(#wash)"/>
  <circle cx="1075" cy="520" r="190" fill="#ebe5ff" opacity="0.7"/>
  <circle cx="930" cy="330" r="120" fill="#ffe3e8" opacity="0.8"/>

  <!-- mark + wordmark -->
  <g transform="translate(80,58)">
    <circle cx="96" cy="72" r="34" fill="#111111"/>
    <circle cx="126" cy="72" r="34" fill="#111111"/>
    <g clip-path="url(#ov)"><circle cx="126" cy="72" r="34" fill="#e1306c"/></g>
    <text x="180" y="88" font-family="Bricolage Grotesque, Geist, Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" letter-spacing="-2" fill="#111111">House of Collabs</text>
  </g>

  <text x="80" y="330" font-family="Bricolage Grotesque, Geist, Segoe UI, system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3.5" fill="#111111">Hire creators.</text>
  <text x="80" y="424" font-family="Bricolage Grotesque, Geist, Segoe UI, system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3.5" fill="#111111">Skip the DMs.</text>

  <text x="80" y="492" font-family="Geist, Segoe UI, system-ui, sans-serif" font-size="30" fill="#6b6478">Fixed prices · clear delivery times · secure payments</text>

  <rect x="80" y="540" width="232" height="14" rx="7" fill="#111111"/>
