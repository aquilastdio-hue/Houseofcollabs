<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-label="urban-tiffin-co logo">
  <rect width="256" height="256" fill="#ffe7d9"/>
  <rect x="36" y="36" width="184" height="184" rx="52" fill="#d4622f"/>
  <text x="128" y="128" text-anchor="middle" dominant-baseline="central" fill="#ffe7d9" font-family="Bricolage Grotesque, Geist, Segoe UI, system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">UT</text>
  <defs>  <filter id="gb" x="0" y="0" width="100%" height="100%">
