# =============================================================================
# Netlify deployment — House of Collabs
# =============================================================================
# The build runs with Netlify's own $URL (the site's primary address), which
# feeds both the generated sitemap and the app's canonical/OpenGraph links, so
# there is no domain hardcoded in this file.
#
# Set these in Netlify → Site configuration → Environment variables:
#   VITE_SUPABASE_URL        https://sxndiarrdfqiepnnczmy.supabase.co
#   VITE_SUPABASE_ANON_KEY   sb_publishable_…
# Never add service-role or Razorpay secret keys here — they belong in
# Supabase Edge Function secrets and would be exposed in the browser bundle.

[build]
  command = "VITE_SITE_URL=$URL npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Dev-only tooling (embedded postgres, test runners) isn't needed to build.
  NPM_FLAGS = "--no-audit --no-fund"

# Deploy previews and branch builds should point at their own URL so that
# password-reset and OAuth callbacks resolve to the deploy being tested.
[context.deploy-preview]
  command = "VITE_SITE_URL=$DEPLOY_PRIME_URL npm run build:netlify"

[context.branch-deploy]
  command = "VITE_SITE_URL=$DEPLOY_PRIME_URL npm run build:netlify"

# -----------------------------------------------------------------------------
# Redirects. Netlify serves a matching static file before consulting redirects,
# so the SPA catch-all below never shadows /assets, /demo, robots.txt, etc.
# -----------------------------------------------------------------------------

# Creator storefronts are streamed by the `sitemap` Edge Function.
[[redirects]]
  from = "/sitemap-creators.xml"
  to = "https://sxndiarrdfqiepnnczmy.supabase.co/functions/v1/sitemap"
  status = 200
  force = true

# There is no favicon. Without these the catch-all below would answer an icon
# request with the whole app, and a browser expecting an image does unhelpful
# things with a page of HTML — Safari in particular then falls back to a stale
# cached icon rather than its own default.
[[redirects]]
  from = "/favicon.ico"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/index.html"
  status = 404

# SPA fallback — client-side router owns every other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Headers
# -----------------------------------------------------------------------------

# Vite emits content-hashed filenames, so these are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# index.html must never be cached, or users get a stale bundle after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
